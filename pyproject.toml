[project]
name = "local-diffusion"
version = "0.1.0"
description = "Local text-to-image generator - FastAPI + diffusers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.13.0",
    "torchvision",
    "diffusers>=0.40.0",
    "transformers>=5.16.1",
    "accelerate>=1.0",
    "safetensors",
    "sentencepiece",
    "protobuf",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=11.0",
    "python-multipart",
    "huggingface-hub[hf-xet]>=0.30",
    "pydantic>=2.9",
    "torchao",
    # LOCAL_DIFFUSION_QUANT=nunchaku only. `kernels` fetches the Nunchaku Lite CUDA ops from
    # the Hub and publishes Linux builds only; bitsandbytes carries those
    # checkpoints' NF4 text encoders. Linux markers, so a Windows `uv sync` is
    # unchanged and one from WSL 2 picks both up.
    "kernels>=0.16,<0.17; sys_platform == 'linux'",
    "bitsandbytes>=0.50; sys_platform == 'linux'",
    "peft>=0.20.0",
    # Password-protected gallery bundles (backend/bundle_crypto.py).
    "cryptography>=44",
]

[dependency-groups]
# Nothing in the app imports these; `uv run --group dev pytest` gets them.
dev = ["pytest>=8", "ruff>=0.17"]

[tool.uv]
# torch/torchvision come from the CUDA 13.0 index (Blackwell sm_120 support)

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["work", "docs"]

[tool.ruff.lint]
# Correctness only: syntax, undefined and unused names, and the bugbear
# checks that catch real mistakes. Style stays the code's own.
select = ["E4", "E7", "E9", "F", "B"]
# Body()/Query() defaults are FastAPI's idiom; zip() lengths are checked
# where they matter; the base class's no-op hooks are optional on purpose.
ignore = ["B008", "B905", "B027", "E731"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are imported from helper modules so pytest finds them.
"tests/*" = ["F401", "F811"]
# Each layer's closures are called inside the iteration that defines them.
"tests/test_newbie_text_encoder.py" = ["B023"]
