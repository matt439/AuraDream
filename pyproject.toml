[project]
name = "krea-local"
version = "0.1.0"
description = "Local Krea 2 image generator - FastAPI + diffusers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.13.0",
    "torchvision",
    "diffusers>=0.40.0",
    "transformers>=4.50",
    "accelerate>=1.0",
    "safetensors",
    "sentencepiece",
    "protobuf",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pillow>=11.0",
    "python-multipart",
    "huggingface-hub[hf-xet]>=0.30",
    "pydantic>=2.9",
    "torchao",
]

[dependency-groups]
# Nothing in the app imports these; `uv run --group dev pytest` gets them.
dev = ["pytest>=8"]

[tool.uv]
# torch/torchvision come from the CUDA 13.0 index (Blackwell sm_120 support)

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
