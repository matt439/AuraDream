<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- What the server answers for "/" while it asks for a passcode and this
     browser is not signed in (backend/passcode.py). Self-contained as
     offline.html is (its style, icon and script inline, no page script
     loaded, nothing registered): nothing under /static/ answers before
     sign-in. The title is the page's own, exactly: the scripts that ask
     whether AuraDream is the program on a port read it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131318">
<title>AuraDream</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: #0b0b0e; color: #e8e8ee;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 420px; padding: 28px 24px;
    background: #131318; border: 1px solid #26262f; border-radius: 14px; text-align: center;
  }
  svg { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 16px 0 8px; font-size: 20px; line-height: 1.3; }
  p { margin: 0 0 16px; color: #c9c9d4; overflow-wrap: anywhere; }
  form { display: flex; flex-direction: column; gap: 10px; text-align: left; }
  label { color: #c9c9d4; font-size: 13px; }
  /* 16px: iOS zooms the page into a smaller field as it is focused. */
  input {
    width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #3a3a47; border-radius: 10px;
    background: #0b0b0e; color: #e8e8ee; font: inherit; font-size: 16px;
  }
  #state { margin: 2px 0; color: #ffb4a8; font-size: 13px; min-height: 1.5em; text-align: center; }
  button {
    min-height: 44px; padding: 10px 22px; border: 0; border-radius: 10px;
    background: #6a4cf0; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button[aria-disabled="true"] { opacity: 0.6; cursor: progress; }
  input:focus-visible, button:focus-visible { outline: 2px solid #b48cff; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 512 512" aria-hidden="true">
    <defs>
      <radialGradient id="bg" cx="50%" cy="42%" r="70%">
        <stop offset="0" stop-color="#221c3d"/><stop offset="1" stop-color="#0b0b0e"/>
      </radialGradient>
      <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4ad6c8"/><stop offset="0.55" stop-color="#7c5cff"/><stop offset="1" stop-color="#b48cff"/>
      </linearGradient>
      <mask id="crescent">
        <circle cx="248" cy="262" r="104" fill="#fff"/><circle cx="302" cy="218" r="92" fill="#000"/>
      </mask>
    </defs>
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="256" r="158" fill="none" stroke="url(#ring)" stroke-width="18"/>
    <rect width="512" height="512" fill="#ece8ff" mask="url(#crescent)"/>
  </svg>
  <h1>Sign in to AuraDream</h1>
  <p>AuraDream on <strong id="where">this server</strong> asks for a passcode.</p>
  <form id="form" novalidate>
    <label for="passcode">Passcode</label>
    <input type="password" id="passcode" name="passcode" autocomplete="current-password"
           autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <div id="state" role="status" aria-live="polite"></div>
    <button type="submit" id="sign-in">Sign in</button>
  </form>
</main>
<script>
'use strict';
const where = document.getElementById('where');
const form = document.getElementById('form');
const field = document.getElementById('passcode');
const state = document.getElementById('state');
const button = document.getElementById('sign-in');
where.textContent = location.host || 'this server';
let sending = false;

function waitWords(response) {
  const seconds = parseInt(response.headers.get('Retry-After') || '', 10);
  if (!(seconds > 0)) return 'Too many wrong passcodes. Wait a moment and try again.';
  return `Too many wrong passcodes. Wait ${seconds} second${seconds === 1 ? '' : 's'} and try again.`;
}

async function signIn(event) {
  event.preventDefault();
  if (sending) return;
  if (!field.value.trim()) {
    state.textContent = 'Type the passcode first.';
    field.focus();
    return;
  }
  sending = true;
  // Held, not disabled: the button keeps its place in the tab order, and
  // says why (UI#54).
  button.setAttribute('aria-disabled', 'true');
  button.title = 'Signing in; wait for the answer';
  state.textContent = 'Signing in…';
  try {
    // In the body, never the address: addresses are logged and sent on.
    const response = await fetch('/api/passcode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ passcode: field.value }),
      credentials: 'same-origin',
      cache: 'no-store',
    });
    if (response.status === 204) {
      state.textContent = 'Signed in — opening…';
      location.replace('/');
      return;
    }
    if (response.status === 429) {
      state.textContent = waitWords(response);
    } else if (response.status === 404 || response.status === 405) {
      // The passcode was turned off since this page loaded: the app answers.
      location.replace('/');
      return;
    } else {
      let detail = '';
      try { detail = (await response.json()).detail; } catch { /* not JSON */ }
      state.textContent = typeof detail === 'string' && detail ? detail : 'The server refused that. Try again.';
      field.select();
    }
  } catch {
    state.textContent = 'The server did not answer. Try again.';
  }
  sending = false;
  button.removeAttribute('aria-disabled');
  button.removeAttribute('title');
}

form.addEventListener('submit', signIn);
</script>
</body>
</html>
