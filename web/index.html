<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krea Local</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Krea<span>Local</span></div>
  <div class="status" id="status">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">checking…</span>
  </div>
  <div class="vram" id="vram"></div>
  <button class="ghost" id="btn-unload" title="Free VRAM">Unload</button>
</header>

<main>
  <aside class="panel">
    <label class="field">
      <span>Prompt</span>
      <textarea id="prompt" rows="5" placeholder="a fox walking in the snow, overcast light"></textarea>
    </label>

    <label class="field" id="negative-field">
      <span>Negative prompt <em id="neg-note">(needs CFG &gt; 1 &mdash; ~2&times; slower)</em></span>
      <textarea id="negative" rows="2" placeholder="blurry, watermark"></textarea>
    </label>

    <div class="field">
      <span>Size</span>
      <div class="presets" id="presets"></div>
      <div class="row">
        <label class="sub"><i>W</i><input type="number" id="width" value="1024" step="16" min="256" max="2048"></label>
        <label class="sub"><i>H</i><input type="number" id="height" value="1024" step="16" min="256" max="2048"></label>
      </div>
      <p class="hint" id="size-hint"></p>
    </div>

    <div class="row">
      <label class="sub grow"><i>Steps</i><input type="number" id="steps" value="8" min="1" max="100"></label>
      <label class="sub grow"><i>CFG</i><input type="number" id="cfg" value="0" min="0" max="20" step="0.1"></label>
      <label class="sub grow"><i>Mu</i><input type="number" id="mu" value="1.15" min="0" max="10" step="0.05"></label>
    </div>

    <div class="row">
      <label class="sub grow"><i>Seed</i><input type="number" id="seed" placeholder="random" min="0"></label>
      <label class="sub"><i>Batch</i><input type="number" id="batch" value="1" min="1" max="8"></label>
      <button class="ghost square" id="btn-dice" title="Clear seed (randomize)">🎲</button>
    </div>

    <button class="primary" id="btn-generate">Generate</button>
    <div class="progress" id="progress" hidden>
      <div class="bar"><div class="fill" id="progress-fill"></div></div>
      <span id="progress-text"></span>
    </div>
    <p class="error" id="error" hidden></p>
  </aside>

  <section class="stage">
    <div class="viewer" id="viewer">
      <p class="placeholder">Generated images appear here.</p>
    </div>

    <div class="gallery-head">
      <h2>Gallery <span id="gallery-count"></span></h2>
      <input type="search" id="search" placeholder="Search prompts…">
      <label class="check"><input type="checkbox" id="fav-only"> Favorites</label>
    </div>
    <div class="grid" id="gallery"></div>
    <button class="ghost wide" id="btn-more" hidden>Load more</button>
  </section>
</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="close" id="lb-close">✕</button>
  <img id="lb-img" alt="">
  <div class="lb-meta" id="lb-meta"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
