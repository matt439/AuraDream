<div id="ld-feature-preferences">
  <div class="fp-status text-small" aria-live="polite" id="fp-progress"></div>
  <section id="fp-overview" aria-label="Feature areas">
    <div class="fp-overview-grid" id="fp-areas"></div>
  </section>
  <section id="fp-detail" aria-label="Optional feature details" hidden>
    <div class="viz-row fp-detail-head">
      <button type="button" class="btn btn-ghost" id="fp-back">Back to overview</button>
      <label class="form-label fp-area-field">Area<select class="form-select" id="fp-area-select"></select></label>
    </div>
    <div class="viz-row fp-detail-head">
      <span class="text-small" id="fp-page-status"></span>
      <button type="button" class="btn btn-ghost" id="fp-never"></button>
    </div>
    <div id="fp-questions"></div>
    <div class="viz-row fp-page-nav">
      <button type="button" class="btn" id="fp-previous">Previous</button>
      <button type="button" class="btn" id="fp-next">Next</button>
    </div>
  </section>
  <hr>
  <div class="viz-row">
    <button type="button" class="btn btn-primary" id="fp-send">Send answers to chat</button>
    <button type="button" class="btn" id="fp-copy">Copy answers</button>
  </div>
  <p class="text-small" id="fp-feedback" role="status"></p>
  <label class="form-label" id="fp-export-wrap" hidden>Answers to paste into this chat<textarea class="form-control" id="fp-export" rows="7" readonly></textarea></label>
</div>
<style>
#ld-feature-preferences{color:var(--foreground);max-width:100%;min-width:0}
#ld-feature-preferences .fp-status{margin-bottom:18px;padding-right:100px;min-height:32px}
#ld-feature-preferences .fp-overview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px}
#ld-feature-preferences .fp-area{min-width:0;display:grid;gap:6px;align-content:start}
#ld-feature-preferences .fp-area-line{display:flex;gap:8px;align-items:center;min-width:0}
#ld-feature-preferences .fp-select-wrap{flex:1;min-width:0}
#ld-feature-preferences .fp-detail-head{margin-bottom:16px;justify-content:space-between;align-items:end}
#ld-feature-preferences .fp-area-field{width:min(300px,100%);min-width:0}
#ld-feature-preferences .fp-question{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--border);min-width:0}
#ld-feature-preferences .fp-question:first-child{padding-top:0}
#ld-feature-preferences .fp-question-name{font-weight:500;overflow-wrap:anywhere}
#ld-feature-preferences .fp-rating{display:flex;gap:6px;flex-wrap:wrap}
#ld-feature-preferences .fp-page-nav{justify-content:space-between;margin-top:16px}
#ld-feature-preferences #fp-feedback:empty{display:none}
#ld-feature-preferences #fp-export{margin-top:8px}
#ld-feature-preferences [hidden]{display:none!important}
@media(max-width:520px){#ld-feature-preferences .fp-overview-grid{grid-template-columns:minmax(0,1fr);gap:14px}#ld-feature-preferences .fp-status{padding-right:96px}#ld-feature-preferences .fp-detail-head{align-items:start}#ld-feature-preferences .fp-area-field{width:100%}}
</style>
<script>
(()=>{
  const root=document.getElementById('ld-feature-preferences');
  const el=id=>root.querySelector('#'+id);
  const levels=[['often','Often'],['sometimes','Sometimes'],['never','Never'],['unsure','Not sure']];
  const areas=[
    {id:'A',name:'Generating images',items:[
      'Write or edit a prompt','Use a negative prompt','Choose an aspect-ratio preset','Choose a resolution tier','Enter custom dimensions or swap orientation','Change Steps','Change CFG','Change Mu','Change True CFG','Generate with a random seed','Enter a specific seed','Change Batch: several images together','Use Repeat: batches one after another','Reset the panel to defaults']},
    {id:'B',name:'Prompt assistance',items:[
      'Insert an author example prompt','Read prompting guidance or control help','Use tag autocomplete','Insert recommended tags, prefixes or negative tags','Edit, remove or reorder prompt chips','Check token counts and truncation','Check prompt rules and tag ordering','Apply a correction or reordered prompt','Ask the local critic for advice','Use the critic rewrite','Compare prompt versions on shared seeds','Expand a prompt with ERNIE','Load settings from a PNG','Undo a prompt or settings replacement']},
    {id:'C',name:'Grid experiments',items:[
      'Sweep Steps','Sweep CFG','Sweep Mu','Sweep LoRA weight','Try consecutive seeds across settings','Supply an explicit seed list','Use prompt variables','Cross several axes in one experiment','Review prompts, counts and time or disk estimates','Set a time budget','Resume a grid, skipping completed or queued cells']},
    {id:'D',name:'Jobs and progress',items:[
      'Watch progress, elapsed time and estimates','Watch live image previews','Review earlier results from this session','Queue work while another job runs','Change which job I am watching','Pause and resume work','Cancel running work','Cancel queued work','Retry skipped cells or resume the remainder','Leave and reconnect to ongoing work']},
    {id:'E',name:'Finding and organising images',items:[
      'Browse the gallery and load older images','Filter to starred images','Show images from all checkpoints','Find a recent run','Search by prompt words','Search by run, submission, ID, seed or date','Search by size, model or sampling settings','Search by LoRA, source, mask or editing type','Search from an image setting or prompt','Change card size or Fit/Crop thumbnails','Put the gallery beside the newest result','Pick images or ranges across filters']},
    {id:'F',name:'Inspecting and comparing',items:[
      'Open full-size images and browse between them','Zoom, pan, fit or inspect actual pixels','Read full prompts and settings','Follow source, reference or run links','Star or unstar one image','Compare an edited image with its source','Compare images at different CFG values','Use swipe or side-by-side comparison','View a run or search as a contact sheet','Choose sheet axes and pinned slices','Enlarge sheet cells with Fill width','Export a sheet or all slices as PNGs']},
    {id:'G',name:'Reusing and making more',items:[
      'Reuse settings from an image','Take just the seed from an image','Reuse the references from an image','Make more seeds of one image batch','Make more seeds of picked or filtered batches','Make more seeds of an entire run','Re-render images at another size','Swap or remove tags and rerun images','Star or unstar picked images together']},
    {id:'H',name:'Refine, Inpaint and Outpaint',items:[
      'Refine an image at its current size','Enlarge an image using Refine','Refine with a revised prompt','Try several strengths or versions','Mass-refine picked or filtered images','Include other models or existing passes in mass refine','Inpaint part of an image','Paint or erase a mask; adjust size or feather','Invert, clear, undo or hide the mask','Outpaint with individual side extensions','Outpaint using growth or aspect presets','Adjust the outpaint blending band']},
    {id:'I',name:'LoRAs and references',items:[
      'Choose a LoRA adapter','Adjust LoRA weight','Use gallery images as references','Reorder or remove references']},
    {id:'J',name:'Copying, bin and bundles',items:[
      'Copy a prompt or seed','Copy a full-size image to the clipboard','Open an original PNG to view or save','Bin individual images','Bin several picked images','Delete unstarred images in the current scope','Restore images from the bin','Permanently delete images or empty the bin','Back up the entire gallery','Bundle only picked or starred images','Password-protect a bundle','Bundle and clear the working gallery','Download saved bundles','Import or merge a bundle']},
    {id:'K',name:'Models and startup',items:[
      'Switch checkpoints','Compare model guidance, timings or examples','Favourite models','Change quantization','Change offload mode','Save a model choice without loading it','Load, unload or retry weights','Configure automatic loading at startup','Use WSL and Nunchaku']},
    {id:'L',name:'Terminal and shortcuts',items:[
      'Generate, run grids or edit from the terminal','Use CLI dry-run','Inspect keeper rates by settings','Clear or filter-clean from the terminal','Reindex or recover from PNG metadata','Use keyboard shortcuts and navigation','Use image right-click menus','Use Ctrl or Shift selection shortcuts']}
  ];
  const areaIds=new Set(areas.map(a=>a.id));
  const featureIds=new Set(areas.flatMap(a=>a.items.map((_,i)=>a.id+(i+1))));
  const validLevel=value=>levels.some(([key])=>key===value);
  let state={overview:{},features:{},area:null,page:0};
  function sanitize(value){
    const model=value?.modelContent||{};const ui=value?.privateContent||{};
    const clean=(source,ids)=>Object.fromEntries(Object.entries(source||{}).filter(([key,val])=>ids.has(key)&&validLevel(val)));
    return {overview:clean(model.areaRatings,areaIds),features:clean(model.featureRatings,featureIds),area:areaIds.has(ui.area)?ui.area:null,page:Number.isInteger(ui.page)?Math.max(0,ui.page):0};
  }
  function snapshot(){return {modelContent:{version:1,scope:'Local Diffusion personal workstation feature preferences',areaRatings:state.overview,featureRatings:state.features,unanswered:'Unanswered items have no inferred rating; area ratings do not rate individual features.'},privateContent:{area:state.area,page:state.page}}}
  function persist(){try{window.openai?.setWidgetState?.(snapshot())?.catch(()=>{})}catch{}}
  try{state=sanitize(window.openai?.widgetState)}catch{}
  window.addEventListener('openai:set_globals',event=>{const next=event.detail?.globals?.widgetState;if(next){const restored=sanitize(next);if(JSON.stringify(restored)!==JSON.stringify(state)){state=restored;render()}}});
  const titleFor=key=>levels.find(([id])=>id===key)?.[1]||'Unanswered';
  function answeredCount(){return Object.keys(state.overview).length+Object.keys(state.features).length}
  function rateOverview(id,value){if(validLevel(value))state.overview[id]=value;else delete state.overview[id];persist();updateProgress()}
  function updateProgress(){
    const n=Object.keys(state.overview).length,f=Object.keys(state.features).length;
    el('fp-progress').textContent=`${n} of ${areas.length} areas answered${f?` · ${f} optional details answered`:''}`;
    for(const id of ['fp-send','fp-copy'])el(id).setAttribute('aria-disabled',String(!answeredCount()));
  }
  function overview(){
    el('fp-areas').replaceChildren(...areas.map(area=>{
      const wrap=document.createElement('div');wrap.className='fp-area';
      const label=document.createElement('label');label.className='form-label';label.htmlFor='fp-rating-'+area.id;label.textContent=area.name;
      const line=document.createElement('div');line.className='fp-area-line';
      const holder=document.createElement('div');holder.className='fp-select-wrap';
      const select=document.createElement('select');select.className='form-select';select.id='fp-rating-'+area.id;
      select.setAttribute('aria-label',area.name+' usage');
      select.append(new Option('Unanswered',''),...levels.map(([id,title])=>new Option(title,id)));
      select.value=state.overview[area.id]||'';select.addEventListener('change',()=>rateOverview(area.id,select.value));
      holder.append(select);
      const detail=document.createElement('button');detail.type='button';detail.className='btn btn-ghost';detail.textContent='Details';detail.setAttribute('aria-label','Optional details: '+area.name);
      detail.addEventListener('click',()=>{state.area=area.id;state.page=0;persist();render();el('fp-back').focus({preventScroll:true})});
      line.append(holder,detail);wrap.append(label,line);return wrap;
    }));
  }
  function detail(){
    const area=areas.find(a=>a.id===state.area);if(!area)return;
    const pages=Math.ceil(area.items.length/6);state.page=Math.min(state.page,pages-1);
    el('fp-area-select').value=area.id;
    el('fp-page-status').textContent=`${area.name} · ${state.page+1} of ${pages}`;
    const remaining=area.items.filter((_,i)=>!state.features[area.id+(i+1)]).length;
    el('fp-never').textContent=remaining?`Never for ${remaining} unanswered in this area`:'All details in this area answered';
    el('fp-never').setAttribute('aria-disabled',String(!remaining));
    el('fp-questions').replaceChildren(...area.items.slice(state.page*6,state.page*6+6).map((title,offset)=>{
      const id=area.id+(state.page*6+offset+1);
      const row=document.createElement('div');row.className='fp-question';row.dataset.feature=id;
      const name=document.createElement('div');name.className='fp-question-name';name.id='fp-name-'+id;name.textContent=title;
      const choices=document.createElement('div');choices.className='fp-rating';choices.setAttribute('role','group');choices.setAttribute('aria-labelledby',name.id);
      levels.forEach(([value,label])=>{const button=document.createElement('button');button.type='button';button.className='btn';button.textContent=label;button.dataset.level=value;button.setAttribute('aria-pressed',String(state.features[id]===value));button.setAttribute('aria-label',label+': '+title);button.setAttribute('data-tooltip','Choose '+label.toLowerCase()+'; press a chosen option again to clear');button.addEventListener('click',()=>{if(state.features[id]===value)delete state.features[id];else state.features[id]=value;choices.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(state.features[id]===b.dataset.level)));persist();updateProgress();updateRemaining(area)});choices.append(button)});
      row.append(name,choices);return row;
    }));
    el('fp-previous').textContent=state.page?'Previous':'Previous area';
    el('fp-previous').setAttribute('aria-disabled',String(state.page===0&&areas.indexOf(area)===0));
    el('fp-next').textContent=state.page<pages-1?'Next six':areas.indexOf(area)<areas.length-1?'Next area':'Back to overview';
  }
  function updateRemaining(area){const n=area.items.filter((_,i)=>!state.features[area.id+(i+1)]).length;el('fp-never').textContent=n?`Never for ${n} unanswered in this area`:'All details in this area answered';el('fp-never').setAttribute('aria-disabled',String(!n))}
  function render(){const detailed=!!state.area;el('fp-overview').hidden=detailed;el('fp-detail').hidden=!detailed;if(detailed)detail();else overview();updateProgress()}
  el('fp-area-select').append(...areas.map(a=>new Option(a.name,a.id)));
  el('fp-area-select').addEventListener('change',()=>{state.area=el('fp-area-select').value;state.page=0;persist();render()});
  el('fp-back').addEventListener('click',()=>{const area=state.area;state.area=null;persist();render();el('fp-rating-'+area)?.focus({preventScroll:true})});
  el('fp-never').addEventListener('click',()=>{const area=areas.find(a=>a.id===state.area);if(!area)return;let changed=0;area.items.forEach((_,i)=>{const id=area.id+(i+1);if(!state.features[id]){state.features[id]='never';changed++}});if(changed){persist();render();el('fp-feedback').textContent=`${changed} unanswered details in ${area.name.toLowerCase()} marked Never. Your earlier choices were kept.`}});
  el('fp-previous').addEventListener('click',()=>{const index=areas.findIndex(a=>a.id===state.area);if(state.page)state.page--;else if(index>0){state.area=areas[index-1].id;state.page=Math.ceil(areas[index-1].items.length/6)-1}else return;persist();render()});
  el('fp-next').addEventListener('click',()=>{const index=areas.findIndex(a=>a.id===state.area),area=areas[index];if(state.page<Math.ceil(area.items.length/6)-1)state.page++;else if(index<areas.length-1){state.area=areas[index+1].id;state.page=0}else state.area=null;persist();render()});
  function exportText(){
    const lines=['Local Diffusion UI preferences','Area ratings are broad answers, not ratings for every feature.'];
    const broad=areas.filter(a=>state.overview[a.id]);if(broad.length){lines.push('','Areas:');broad.forEach(a=>lines.push(`${a.name}: ${titleFor(state.overview[a.id])}`))}
    const specific=areas.flatMap(a=>a.items.map((title,i)=>({id:a.id+(i+1),title}))).filter(f=>state.features[f.id]);
    if(specific.length){lines.push('','Optional feature details:');specific.forEach(f=>lines.push(`${f.id} ${f.title}: ${titleFor(state.features[f.id])}`))}
    lines.push('','Everything else is unanswered. Use these answers to adapt the existing personal-workstation design. Ask only about details needed for the next layout decision.');return lines.join('\n');
  }
  function exposeAnswers(message){el('fp-export-wrap').hidden=false;el('fp-export').value=exportText();el('fp-feedback').textContent=message;el('fp-export').focus({preventScroll:true});el('fp-export').select()}
  function hasAnswers(){if(answeredCount())return true;el('fp-feedback').textContent='Choose at least one rating. A partial answer is enough.';return false}
  el('fp-copy').addEventListener('click',async()=>{if(!hasAnswers())return;try{if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(exportText());el('fp-feedback').textContent='Answers copied. Paste them into this chat.'}catch{exposeAnswers('Select and copy these answers, then paste them into this chat.')}});
  el('fp-send').addEventListener('click',async()=>{if(!hasAnswers())return;persist();if(typeof window.openai?.sendFollowUpMessage!=='function'){exposeAnswers('Paste these answers into this chat.');return}try{await window.openai.sendFollowUpMessage({prompt:exportText(),title:'Send your Local Diffusion preferences'});el('fp-feedback').textContent='Answers requested in chat. If no message appears, use Copy answers.'}catch{exposeAnswers('Use the selected text below to send your answers.')}});
  render();
})();
</script>
