# The CPU suite and the lint on every push and on demand. No GPU, no
# weights: what `uv run --group dev pytest` needs locally, on Linux, where a
# runner minute costs half a Windows one and the suite already runs (WSL).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: the job checks out, lints and tests, and forks' pull
# requests run it too.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --group dev ruff check .
      # The real-tokenizer tests skip without these: tokenizer files only,
      # never weights. HF_TOKEN (a read token whose account has accepted the
      # gated FLUX.1-Krea-dev and Krea 2 Turbo) reaches this step alone;
      # forks' pull requests get no secrets, so those two warn and skip.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: tokenizers-${{ hashFiles('backend/encoder_table.py', 'tools/fetch_tokenizers.py') }}
      - name: Tokenizers
        run: uv run --group dev python -m tools.fetch_tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # One worker per runner core (pytest-xdist): about half the serial time.
      - name: Test
        run: uv run --group dev pytest -q -n auto
