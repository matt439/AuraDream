# Lint every push/PR. Documentation-only changes skip the CPU test matrix
# and its application/tokenizer downloads (prose the tests read is not
# documentation-only: tools/ci_changes.py). Manual and weekly runs keep the
# full gate. CPU tests use Linux and, for main and pull requests into it,
# Windows, split across five runners. No GPU or model weights. A commit
# already covered runs once (tools/ci_duplicates.py): a branch push with an
# open pull request (or one opened within its grace) leaves it to the pull
# request's run, and the push merging a pull request whose run passed the
# same tree skips. The `gate` job is the one check main's ruleset requires:
# it passes only when every job its run owed passed.
# Hosted runners cost nothing on a public repository.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly on main: the full gate against the runners' current images and
  # Chrome, and main's dependency caches, which pull requests restore,
  # kept warm (a merge push skips its tests, so nothing else saves them).
  schedule:
    - cron: "17 3 * * 1"

# Read-only token: the job checks out, lints and tests, and forks' pull
# requests run it too. The duplicate check reads pull requests and runs.
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # A push to main never cancels the weekly run.
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-weekly' || '' }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_tests: ${{ steps.changes.outputs.full_tests }}
      duplicate: ${{ steps.duplicate.outputs.duplicate }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Compare the entire pushed range or PR, not only the tip commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          # Its own cache: lint installs only the dev tools, or nothing when
          # it skips, and once saved under the test jobs' key that empty
          # cache was what every later run restored.
          cache-suffix: lint
          python-version: "3.13"
      - name: Classify changed paths
        id: changes
        run: uv run --no-project python tools/ci_changes.py
      - name: Skip a commit another run covers
        id: duplicate
        # A crash leaves the output unset, so everything runs.
        continue-on-error: true
        run: uv run --no-project python tools/ci_duplicates.py
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_TESTS: ${{ steps.changes.outputs.full_tests }}
      - name: Install development tools only
        if: ${{ steps.duplicate.outputs.duplicate != 'true' }}
        run: uv sync --locked --only-group dev
      - name: Lint
        if: ${{ steps.duplicate.outputs.duplicate != 'true' }}
        run: uv run --no-sync ruff check .

  test:
    needs: lint
    if: ${{ needs.lint.outputs.full_tests == 'true' && needs.lint.outputs.duplicate != 'true' }}
    strategy:
      # One system's failure never cancels the other's answer.
      fail-fast: false
      # Windows takes about five times as long as Linux for the suite (about
      # 25 minutes on four workers), so it runs for main only: pull requests
      # into it, and pushes, manual and weekly runs on it, in five parts on
      # five runners (`pytest --shard`, tests/shard.py), about six minutes
      # each. Other branches get Linux.
      matrix:
        include: ${{ fromJSON((github.event_name == 'pull_request' && github.base_ref == 'main' || github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && '[{"os":"ubuntu-latest","shard":"1/1"},{"os":"windows-latest","shard":"1/5"},{"os":"windows-latest","shard":"2/5"},{"os":"windows-latest","shard":"3/5"},{"os":"windows-latest","shard":"4/5"},{"os":"windows-latest","shard":"5/5"}]' || '[{"os":"ubuntu-latest","shard":"1/1"}]') }}
    # "test (ubuntu-latest)", "test (windows-latest, 2/5)": ci_duplicates.py
    # reads these names.
    name: test (${{ matrix.os }}${{ matrix.shard != '1/1' && format(', {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # A part takes about six minutes; a hung one fails well inside this (and
    # pytest-timeout names a hung test first).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # One Node major on every runner, as on the PCs the suite runs on: the
      # images' own differ (22 on Windows, 24 on Linux).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The pytest classic-script guard needs Node; absence must fail the gate.
      - name: Verify Node
        run: node --version
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-suffix: app
          # One part per system saves (about 2 GB on Linux, where the CUDA
          # wheels took nearly two minutes to download); the rest restore.
          save-cache: ${{ startsWith(matrix.shard, '1/') }}
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --group dev
      # Once per system: the checker reads every file whichever part runs.
      - name: Type check
        if: ${{ startsWith(matrix.shard, '1/') }}
        run: uv run --no-sync python tools/typecheck.py
      # The real-tokenizer tests skip without these: tokenizer files only,
      # never weights. HF_TOKEN (a read token whose account has accepted the
      # gated repos REAL lists: FLUX.1-Krea-dev, FLUX.1-Kontext-dev and Krea 2
      # Turbo) reaches this step alone. With it, a tokenizer that will not
      # come down fails the step, so a revoked token or an outage never
      # passes as skipped tests; forks' pull requests get no secrets, so
      # those warn and skip. The key hashes REAL's file too, so a checkpoint
      # added there is fetched once and cached rather than on every run.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: tokenizers-${{ runner.os }}-${{ hashFiles('backend/encoder_table.py', 'tools/fetch_tokenizers.py', 'tests/test_prompt_encoding.py') }}
      - name: Tokenizers
        run: uv run --group dev python -m tools.fetch_tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # One worker per runner core (pytest-xdist): about half the serial time.
      # The 25 slowest tests across workers are listed after the result (DEV#25).
      # A test still running after ten minutes is hung: pytest-timeout fails
      # it by name (test_storage_interruptions bounds its own child at five).
      - name: Test
        run: uv run --group dev pytest -q -n auto --durations=25 --timeout=600 --shard ${{ matrix.shard }}

  # The browser smokes (DEV#4): every row of AGENTS.md's port table on the
  # runner's Chrome against fake servers, no GPU or weights. Its own job so
  # it never holds up or replaces the CPU tests. Selawik stands in for the
  # Segoe UI the smokes are written against (tools/smoke_fonts.py). The
  # table is about 37 minutes of smoke time: five runners take a fifth
  # each (`run_smoke.py --shard`, balanced by tools/run_smoke_costs.json), two
  # smokes at once on each four-core runner, longest first. One runner at
  # three at once took about 15 minutes, and on four cores four at once
  # failed smokes that pass alone (refine, sheet, compare-cfg,
  # compact-setup in PR #36's work). Five is about the most that helps:
  # the longest row (smoke-jobs) takes nearly four minutes alone.
  browser:
    needs: lint
    if: ${{ needs.lint.outputs.full_tests == 'true' && needs.lint.outputs.duplicate != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/5", "2/5", "3/5", "4/5", "5/5"]
    # "browser (2/5)": ci_duplicates.py reads these names.
    name: browser (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify Node and Chrome
        run: |
          node --version
          google-chrome --version
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          # The Linux test job's cache: the same install, saved there.
          cache-suffix: app
          save-cache: false
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --group dev
      - name: Fonts
        # The stand-in copies the system's DejaVu Sans and Noto Color Emoji.
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ] || [ ! -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf ]; then
            sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends fonts-dejavu-core fonts-noto-color-emoji
          fi
          uv run --no-sync python tools/smoke_fonts.py "$RUNNER_TEMP/smoke-fonts"
      # A smoke that failed beside another is rerun alone afterwards, for
      # the diagnosis only: the exit stays the first pass's, so one that
      # passes alone still fails the job (a race to fix, never a pass).
      - name: Smokes
        run: uv run --no-sync python tools/run_smoke.py --all --shard ${{ matrix.shard }} --jobs 2 --rerun-failed-alone --artifacts "$RUNNER_TEMP/smoke-artifacts"
        env:
          AURADREAM_BROWSER: /usr/bin/google-chrome
          AURADREAM_BROWSER_DIAGNOSTICS: "1"
      # Where the table's time went, from summary.json, passed or failed
      # (DEV#25), and each rerun's verdict as an annotation on the run's
      # page; read-only, so it adds no failure beyond a missing summary.
      - name: Smoke timings
        if: ${{ success() || failure() }}
        run: uv run --no-sync python tools/smoke_timings.py "$RUNNER_TEMP/smoke-artifacts" --annotate
      # Each smoke's result, browser output, screenshots and a failed fake's log.
      - name: Keep the diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-${{ strategy.job-index }}
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: warn
          retention-days: 14

  # The one check main's ruleset requires. The matrix jobs cannot be required
  # by name: skipped (documentation-only, or a duplicate push) they report
  # an unexpanded name, and GitHub counts a skipped required check as
  # passed. Only a pull request run into main reports "gate"; any other run
  # reports "gate (push)", "gate (pull_request into dev)" and the like, so a
  # branch push's duplicate run, finished minutes before the pull request's
  # own, never answers for it, and neither does a Linux-only run from before
  # a pull request was retargeted onto main (GitHub matches a required check
  # by name on the head commit, whatever run reported it). A pull
  # request's gate runs however its jobs ended, so a cancelled run fails it;
  # elsewhere a run superseded by a newer push is left cancelled, not red.
  gate:
    name: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && 'gate' || github.event_name == 'pull_request' && format('gate (pull_request into {0})', github.base_ref) || format('gate ({0})', github.event_name) }}
    needs: [lint, test, browser]
    if: ${{ always() && (github.event_name == 'pull_request' || !cancelled()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job this run owed passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BROWSER: ${{ needs.browser.result }}
          FULL: ${{ needs.lint.outputs.full_tests }}
          DUPLICATE: ${{ needs.lint.outputs.duplicate }}
        run: |
          echo "lint=$LINT test=$TEST browser=$BROWSER full_tests=$FULL duplicate=$DUPLICATE"
          [ "$LINT" = success ] || { echo "::error::lint: $LINT"; exit 1; }
          if [ "$FULL" = true ] && [ "$DUPLICATE" != true ]; then
            [ "$TEST" = success ] || { echo "::error::test: $TEST"; exit 1; }
            [ "$BROWSER" = success ] || { echo "::error::browser: $BROWSER"; exit 1; }
          fi

  # Weekly and by hand: the Linux suite on the newest Node, ahead of the
  # pinned 24, so a change like Node 26's (ea44414) shows here before it
  # reaches a PC. Informational: the ruleset requires only the gate.
  node-latest:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: node --version
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-suffix: app
          save-cache: false
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --group dev
      - name: Test
        run: uv run --no-sync pytest -q -n auto --timeout=600
