# Lint every push/PR. Documentation-only changes skip the CPU test matrix
# and its application/tokenizer downloads. Manual runs keep the full gate.
# CPU tests use Linux and, for main and pull requests into it, Windows.
# No GPU or model weights. A commit already covered runs once
# (tools/ci_duplicates.py): a branch push with an open pull request leaves
# it to the pull request's run, and the push merging a pull request whose
# run passed the same tree skips.
# Hosted runners cost nothing on a public repository.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: the job checks out, lints and tests, and forks' pull
# requests run it too. The duplicate check reads pull requests and runs.
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_tests: ${{ steps.changes.outputs.full_tests }}
      duplicate: ${{ steps.duplicate.outputs.duplicate }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Compare the entire pushed range or PR, not only the tip commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Classify changed paths
        id: changes
        run: uv run --no-project python tools/ci_changes.py
      - name: Skip a commit another run covers
        id: duplicate
        # A crash leaves the output unset, so everything runs.
        continue-on-error: true
        run: uv run --no-project python tools/ci_duplicates.py
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_TESTS: ${{ steps.changes.outputs.full_tests }}
      - name: Install development tools only
        if: ${{ steps.duplicate.outputs.duplicate != 'true' }}
        run: uv sync --locked --only-group dev
      - name: Lint
        if: ${{ steps.duplicate.outputs.duplicate != 'true' }}
        run: uv run --no-sync ruff check .

  test:
    needs: lint
    if: ${{ needs.lint.outputs.full_tests == 'true' && needs.lint.outputs.duplicate != 'true' }}
    strategy:
      # One system's failure never cancels the other's answer.
      fail-fast: false
      # Windows takes about five times as long as Linux for the suite, so it
      # runs for main only: pull requests into it, and pushes and manual runs
      # on it, beside the longer browser job. Other branches
      # get Linux.
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' && github.base_ref == 'main' || github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The pytest classic-script guard needs Node; absence must fail the gate.
      - name: Verify Node
        run: node --version
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --group dev
      - name: Type check
        run: uv run --no-sync python tools/typecheck.py
      # The real-tokenizer tests skip without these: tokenizer files only,
      # never weights. HF_TOKEN (a read token whose account has accepted the
      # gated repos REAL lists: FLUX.1-Krea-dev, FLUX.1-Kontext-dev and Krea 2
      # Turbo) reaches this step alone; forks' pull requests get no secrets, so
      # those warn and skip. The key hashes REAL's file too, so a checkpoint
      # added there is fetched once and cached rather than on every run.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: tokenizers-${{ runner.os }}-${{ hashFiles('backend/encoder_table.py', 'tools/fetch_tokenizers.py', 'tests/test_prompt_encoding.py') }}
      - name: Tokenizers
        run: uv run --group dev python -m tools.fetch_tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # One worker per runner core (pytest-xdist): about half the serial time.
      # The 25 slowest tests across workers are listed after the result (DEV#25).
      - name: Test
        run: uv run --group dev pytest -q -n auto --durations=25

  # The browser smokes (DEV#4): every row of AGENTS.md's port table on the
  # runner's Chrome against fake servers, no GPU or weights. Its own job so
  # it never holds up or replaces the CPU tests. Selawik stands in for the
  # Segoe UI the smokes are written against (tools/smoke_fonts.py). Three
  # smokes at once on the four-core runner; the table took about 15 minutes
  # at that width on four cores.
  browser:
    needs: lint
    if: ${{ needs.lint.outputs.full_tests == 'true' && needs.lint.outputs.duplicate != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify Node and Chrome
        run: |
          node --version
          google-chrome --version
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --group dev
      - name: Fonts
        # The stand-in copies the system's DejaVu Sans and Noto Color Emoji.
        run: |
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ] || [ ! -f /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf ]; then
            sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends fonts-dejavu-core fonts-noto-color-emoji
          fi
          uv run --no-sync python tools/smoke_fonts.py "$RUNNER_TEMP/smoke-fonts"
      - name: Smokes
        run: uv run --no-sync python tools/run_smoke.py --all --jobs 3 --artifacts "$RUNNER_TEMP/smoke-artifacts"
        env:
          AURADREAM_BROWSER: /usr/bin/google-chrome
          AURADREAM_BROWSER_DIAGNOSTICS: "1"
      # Where the table's time went, from summary.json, passed or failed
      # (DEV#25); read-only, so it adds no failure beyond a missing summary.
      - name: Smoke timings
        if: ${{ success() || failure() }}
        run: uv run --no-sync python tools/smoke_timings.py "$RUNNER_TEMP/smoke-artifacts"
      # Each smoke's result, browser output, screenshots and a failed fake's log.
      - name: Keep the diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: warn
          retention-days: 14
