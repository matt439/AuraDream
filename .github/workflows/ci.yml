# Lint every push/PR. Documentation-only changes skip the CPU test matrix
# and its application/tokenizer downloads. Manual runs keep the full gate.
# CPU tests use Linux and, on main, Windows. No GPU or model weights.
# Hosted runners cost nothing on a public repository.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: the job checks out, lints and tests, and forks' pull
# requests run it too.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_tests: ${{ steps.changes.outputs.full_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Compare the entire pushed range or PR, not only the tip commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install development tools only
        run: uv sync --locked --only-group dev
      - name: Classify changed paths
        id: changes
        run: uv run --no-sync python tools/ci_changes.py
      - name: Lint
        run: uv run --no-sync ruff check .

  test:
    needs: lint
    if: ${{ needs.lint.outputs.full_tests == 'true' }}
    strategy:
      # One system's failure never cancels the other's answer.
      fail-fast: false
      # Windows takes about five times as long as Linux for the suite, so it
      # runs on main only (pushes and by hand); branches and pull requests
      # get Linux.
      matrix:
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The pytest classic-script guard needs Node; absence must fail the gate.
      - name: Verify Node
        run: node --version
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --group dev
      - name: Type check
        run: uv run --no-sync python tools/typecheck.py
      # The real-tokenizer tests skip without these: tokenizer files only,
      # never weights. HF_TOKEN (a read token whose account has accepted the
      # gated FLUX.1-Krea-dev and Krea 2 Turbo) reaches this step alone;
      # forks' pull requests get no secrets, so those two warn and skip.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: tokenizers-${{ runner.os }}-${{ hashFiles('backend/encoder_table.py', 'tools/fetch_tokenizers.py') }}
      - name: Tokenizers
        run: uv run --group dev python -m tools.fetch_tokenizers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # One worker per runner core (pytest-xdist): about half the serial time.
      - name: Test
        run: uv run --group dev pytest -q -n auto

  # The browser smokes (DEV#4): every row of AGENTS.md's port table on the
  # runner's Chrome against fake servers, no GPU or weights. Its own job so
  # it never holds up or replaces the CPU tests. Selawik stands in for the
  # Segoe UI the smokes are written against (tools/smoke_fonts.py). Three
  # smokes at once on the four-core runner; the table took about 15 minutes
  # at that width on four cores.
  browser:
    needs: lint
    if: ${{ needs.lint.outputs.full_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Verify Node and Chrome
        run: |
          node --version
          google-chrome --version
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --group dev
      - name: Fonts
        run: uv run --no-sync python tools/smoke_fonts.py "$RUNNER_TEMP/smoke-fonts"
      - name: Smokes
        run: uv run --no-sync python tools/run_smoke.py --all --jobs 3 --artifacts "$RUNNER_TEMP/smoke-artifacts"
        env:
          AURADREAM_BROWSER: /usr/bin/google-chrome
          AURADREAM_BROWSER_DIAGNOSTICS: "1"
      # Each smoke's result, browser output, screenshots and a failed fake's log.
      - name: Keep the diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: warn
          retention-days: 14
