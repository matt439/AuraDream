# The CPU suite and the lint on every push and on demand. No GPU, no
# weights: what `uv run --group dev pytest` needs locally, on Linux, where a
# runner minute costs half a Windows one and the suite already runs (WSL).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: the job checks out, lints and tests, and forks' pull
# requests run it too.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --group dev ruff check .
      - name: Test
        run: uv run --group dev pytest -q
